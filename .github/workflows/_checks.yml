name: PR Checks

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize ]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: "pnpm"
      - name: Install commitlint dependencies
        run: pnpm install --filter . --frozen-lockfile --prod=false --ignore-scripts
      - name: Lint commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  changeset-check:
    name: Changeset check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for changesets
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv README; then
            echo "Changesets found"
          else
            echo "::warning::No changeset found."
            BODY="No changeset found. Consider running \`pnpm changeset\` or \`pnpm changeset:suggest\` locally."
            gh pr comment "$PR_NUMBER" --body "$BODY" --edit-last 2>/dev/null \
              || gh pr comment "$PR_NUMBER" --body "$BODY"
          fi
