name: Dev Docs CI

on:
  workflow_call:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      # The docs site is built by the root devDependency lectio-docs, which
      # reads docs.config.ts and collects markdown straight from the checkout —
      # no workspace packages are needed, so install root deps only.
      - name: Install dependencies
        run: pnpm install --filter eventuras --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm docs:build
